# Gabarit — copier en `serving-secret.yaml` (ignoré par .gitignore, jamais committé) et
# remplacer les valeurs. Même convention que gravia/.env.example (cf. gravia/CLAUDE.md,
# "Ne jamais committer de secrets").
#
#   cp k8s/serving-secret.example.yaml k8s/serving-secret.yaml
#
# Les valeurs ci-dessous (minioadmin/minioadmin) sont les identifiants MinIO par défaut de la
# stack dev gravia (cf. gravia/infra/docker-compose.yml) — dev uniquement, sans valeur hors de
# la machine locale. En cible EKS réelle, ces identifiants viendraient d'AWS Secrets Manager
# (cf. gravia/CLAUDE.md, architecture prod), pas d'un fichier K8s Secret en clair.
apiVersion: v1
kind: Secret
metadata:
  name: gravia-serving-secrets
  namespace: gravia
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
